<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' http://127.0.0.1:*;">
<title>Win2Mac Studio</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="redesign.css">
</head>
<body>
<div class="frame">
  <aside class="sidebar">
    <div class="sidebar-drag"></div>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><rect x="3" y="3" width="24" height="24" rx="7" fill="#c8f169"/><rect x="13" y="13" width="24" height="24" rx="7" fill="#111316" stroke="#f7f6f2" stroke-width="2.4"/><path d="M20.5 20.5l5.5 5.5m0-5.5L20.5 26" stroke="#c8f169" stroke-width="2.2" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-text">
        <strong>Win2Mac</strong>
        <small>APP PORTER</small>
      </span>
    </div>

    <div class="sidebar-group">Workspace</div>
    <nav class="nav" aria-label="主导航">
      <button class="nav-item" data-nav="library" title="应用库">
        <svg class="icon"><use href="#i-grid"></use></svg><span>应用库</span>
      </button>
      <button class="nav-item" data-nav="tasks" title="转换任务">
        <svg class="icon"><use href="#i-layers"></use></svg><span>转换任务</span><span class="nav-count" id="task-count"></span>
      </button>
      <button class="nav-item" data-nav="compat" title="兼容性">
        <svg class="icon"><use href="#i-shield"></use></svg><span>兼容性</span>
      </button>
      <button class="nav-item" data-nav="settings" title="设置">
        <svg class="icon"><use href="#i-settings"></use></svg><span>设置</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="runtime-card">
        <div class="runtime-row">
          <span class="status-dot"></span>
          <span>Wine 运行时</span>
          <span class="runtime-ver" id="runtime-version">11.18</span>
        </div>
        <p id="runtime-caption">开源引擎已锁定 · x86_64</p>
      </div>
      <div class="mode-chip" id="mode-chip">
        <span class="mode-dot"></span><span id="mode-label">本机模式</span>
      </div>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-title">
        <h2 id="page-title">应用库</h2>
        <p id="page-subtitle">检测、评估并打包 Windows 应用</p>
      </div>
      <div class="topbar-search" id="topbar-search">
        <svg class="icon"><use href="#i-search"></use></svg>
        <input id="search-input" type="search" placeholder="搜索应用、发布者或路径…" autocomplete="off" spellcheck="false">
        <kbd>Ctrl K</kbd>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
      <div class="window-controls">
        <button class="window-btn" data-action="minimize" aria-label="最小化"><svg viewBox="0 0 10 10"><path d="M2 5h6" /></svg></button>
        <button class="window-btn" data-action="maximize" aria-label="最大化"><svg viewBox="0 0 10 10"><rect x="2.2" y="2.2" width="5.6" height="5.6" rx=".8" /></svg></button>
        <button class="window-btn close" data-action="close" aria-label="关闭"><svg viewBox="0 0 10 10"><path d="M2.3 2.3l5.4 5.4M7.7 2.3L2.3 7.7" /></svg></button>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
<div id="drop-overlay" class="drop-overlay" aria-hidden="true">
  <div class="drop-card">
    <span class="drop-visual"><svg class="icon"><use href="#i-download"></use></svg></span>
    <h3>松开以添加应用</h3>
    <p>支持 .exe、.msi、.zip、.app 或整个应用文件夹</p>
    <span class="drop-hint">先分析兼容性，不修改原始文件</span>
  </div>
</div>

<svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-2.9 8.1-7 10-4.1-1.9-7-5.5-7-10V6l7-3z"/><path d="M9.2 12l2 2 3.6-3.8"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>

  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3L12 4z"/><path d="M12 9v5M12 17.2v.1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7V5z"/></symbol>
  <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></symbol>
  <symbol id="i-disk" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12.5 15H17"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.4 4 5.6 4 9s-1.5 6.6-4 9c-2.5-2.4-4-5.6-4-9s1.5-6.6 4-9z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.1"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.4L19 10l-5.1 1.6L12 17l-1.9-5.4L5 10l5.1-1.6L12 3z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/></symbol>
  <symbol id="i-apple" viewBox="0 0 24 24"><path d="M16.2 12.6c0-2.5 2-3.7 2.1-3.8-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.6.9-.7 0-1.9-.9-3.1-.8-1.6 0-3 .9-3.8 2.4-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.2 1.2 0 1.6-.7 3-.7s1.8.7 3.1.7c1.3 0 2.1-1.1 2.9-2.2.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-3.4zM14 5.2c.7-.8 1.1-1.9 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"/></symbol>
  <symbol id="i-windows" viewBox="0 0 24 24"><path d="M3 5.2l8-1.1v7.2H3V5.2zM13 3.8l8-1.1v8.6h-8V3.8zM3 12.7h8v7.2l-8-1.1v-6.1zM13 12.7h8v8.6l-8-1.1v-7.5z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></symbol>
  <symbol id="i-package" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>

</svg>

<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
