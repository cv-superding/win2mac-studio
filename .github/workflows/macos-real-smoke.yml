name: macOS real Wine smoke (manual, GUI runner only)

# GitHub-hosted macOS runners are headless. Wine cannot load win32k.sys/dxgkrnl.sys
# without a WindowServer session, so this job only works on a self-hosted Mac with
# a logged-in GUI session (or a cloud Mac with GUI). Use the normal
# "macOS launcher verification" workflow for hosted-runner regression checks.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted Mac runner label with a GUI session"
        required: true
        default: "self-hosted-macos-gui"

jobs:
  smoke:
    name: macOS Wine smoke on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rosetta 2
        run: |
          if ! arch -x86_64 true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Download Gcenx Wine 11.18
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wine-download" "$RUNNER_TEMP/wine-11.18"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/wine-download/wine.tar.xz" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.18/wine-staging-11.18-osx64.tar.xz"
          echo "b63704b91af269bc026a87f12bd297c4a50caaf570c322e600b6621ef918f127  $RUNNER_TEMP/wine-download/wine.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/wine-download/wine.tar.xz" -C "$RUNNER_TEMP/wine-11.18"

      - name: Verify GUI session
        run: |
          if ! pgrep -x WindowServer >/dev/null; then
            echo "No WindowServer session; this job requires a GUI-capable Mac runner." >&2
            exit 1
          fi

      - name: Run real-macOS smoke
        env:
          WIN2MAC_CI_WINE_ROOT: ${{ runner.temp }}/wine-11.18
        run: bash test/ci/macos-real-smoke.sh

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-${{ inputs.runner }}
          path: |
            ${{ runner.temp }}/win2mac-smoke/logs
            ${{ runner.temp }}/win2mac-smoke/diag
            ${{ runner.temp }}/win2mac-smoke/check
          if-no-files-found: ignore
